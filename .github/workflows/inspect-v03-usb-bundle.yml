name: Inspect original v0.3 USB bundle
on:
  push:
    branches:
      - release/v0.8-complete-usb-package
    paths:
      - '.github/workflows/inspect-v03-usb-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-v03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obtain original release bundle from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v03-source
          gh release download v0.3.0 -p 'PSX.DVR.ISO.MANAGER.03.zip' --dir /tmp/v03-source
          test -s /tmp/v03-source/PSX.DVR.ISO.MANAGER.03.zip
      - name: Audit actual ZIP entries; no assumptions
        run: |
          python3 - <<'PY'
          import zipfile
          p='/tmp/v03-source/PSX.DVR.ISO.MANAGER.03.zip'
          with zipfile.ZipFile(p) as z:
              entries=z.infolist()
              print('ENTRY COUNT:',len(entries))
              for info in entries:
                  print(f'{info.file_size:>10} {info.filename}')
          PY
