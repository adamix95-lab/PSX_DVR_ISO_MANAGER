name: Build HDD Neutrino V probe (safe stop before game)
on:
  push:
    branches:
      - feature/v1.0-hdd-readonly-diagnostics
    paths:
      - 'hdd-diagnostics/neutrino-hdd-probe/**'
      - 'hdd-diagnostics/CMakeLists.txt'
      - '.github/workflows/build-hdd-neutrino-probe.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'hdd-diagnostics/neutrino-hdd-probe/**'
      - 'hdd-diagnostics/CMakeLists.txt'
      - '.github/workflows/build-hdd-neutrino-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - name: Checkout experimental Manager branch
        uses: actions/checkout@v4
      - name: Checkout pinned pcm720 Neutrino DVR fork
        uses: actions/checkout@v4
        with:
          repository: pcm720/neutrino
          ref: aa8d80a1a0b5323cb407c814c0568c3489597c1c
          path: neutrino-pinned
          persist-credentials: false
      - name: Install Python, CMake, GNU make and build tools
        run: apk add --no-cache python3 cmake build-base git
      - name: Validate and patch ONLY ephemeral upstream fork copy
        run: |
          test "$(git -C neutrino-pinned rev-parse HEAD)" = aa8d80a1a0b5323cb407c814c0568c3489597c1c
          python3 hdd-diagnostics/neutrino-hdd-probe/patch_probe.py \
            neutrino-pinned/ee/loader/src/main.c \
            neutrino-pinned/ee/loader/Makefile
          grep -F 'return 0; /* ABSOLUTE no-game stop' neutrino-pinned/ee/loader/src/main.c
          grep -F 'fileXioMount("pfs0:", "hdd0:PP.TESTDVR", FIO_MT_RDONLY)' neutrino-pinned/ee/loader/src/main.c
          grep -F 'strcmp(argv[2], "-dvd=dvr_pfs0:/ISO/DIAG_V_NO_GAME.iso")' neutrino-pinned/ee/loader/src/main.c
      - name: Build only pinned pcm720 EE Neutrino loader with diagnostic stop
        working-directory: neutrino-pinned
        run: |
          make -C ee/loader all
          test -s ee/loader/neutrino.elf
          cp ee/loader/neutrino.elf ../PSX_DVR_HDD_NEUTRINO_V_PROBE.ELF
          test -s ee/loader/neutrino_unpacked.elf
          cp ee/loader/neutrino_unpacked.elf ../PSX_DVR_HDD_NEUTRINO_V2_UNPACKED.ELF
      - name: Build isolated real OSDMenu launcher
        run: |
          cmake -S hdd-diagnostics -B build-hdd-diag
          cmake --build build-hdd-diag --target PSX_DVR_HDD_NEUTRINO_V_LAUNCH.ELF -j2
          test -s build-hdd-diag/PSX_DVR_HDD_NEUTRINO_V_LAUNCH.ELF
          cmake --build build-hdd-diag --target PSX_DVR_HDD_NEUTRINO_V2_LAUNCH.ELF -j2
          test -s build-hdd-diag/PSX_DVR_HDD_NEUTRINO_V2_LAUNCH.ELF
          test -s hdd-diagnostics/neutrino-hdd-probe/DIAG_V2.CNF
          test -s hdd-diagnostics/neutrino-hdd-probe/DIAG_V.CNF
      - name: Instrument same Neutrino source to hold on main entry
        working-directory: neutrino-pinned
        run: |
          python3 ../hdd-diagnostics/neutrino-hdd-probe/patch_w_entry_hold.py ee/loader/src/main.c
          grep -F 'w_busy_hold(8)' ee/loader/src/main.c
          grep -F 'w_busy_hold(16)' ee/loader/src/main.c
          grep -F 'return 0; /* ABSOLUTE no-game stop' ee/loader/src/main.c
          make -C ee/loader clean
          make -C ee/loader all
          test -s ee/loader/neutrino_unpacked.elf
          cp ee/loader/neutrino_unpacked.elf ../PSX_DVR_HDD_NEUTRINO_W_ENTRY.ELF
      - name: Build W original OSDMenu gated launcher
        run: |
          cmake --build build-hdd-diag --target PSX_DVR_HDD_NEUTRINO_W_LAUNCH.ELF -j2
          test -s build-hdd-diag/PSX_DVR_HDD_NEUTRINO_W_LAUNCH.ELF
          test -s hdd-diagnostics/neutrino-hdd-probe/DIAG_W.CNF
      - name: Add controlled DVR LE environment probe (X) to W-tested source
        working-directory: neutrino-pinned
        run: |
          python3 ../hdd-diagnostics/neutrino-hdd-probe/patch_x_dvr_le.py ee/loader/src/main.c
          grep -F 'return 0; /* SAFE HARD STOP BEFORE FHI, ISO and GAME */' ee/loader/src/main.c
          grep -F 'X75 DVR SCMD COMPLETED' ee/loader/src/main.c
          grep -F 'X85 LE MODULES DONE / STOP' ee/loader/src/main.c
          make -C ee/loader clean
          make -C ee/loader all
          cp ee/loader/neutrino_unpacked.elf ../PSX_DVR_HDD_NEUTRINO_X_LE.ELF
          test -s ../PSX_DVR_HDD_NEUTRINO_X_LE.ELF
      - name: Build X original OSDMenu gated launcher
        run: |
          cmake --build build-hdd-diag --target PSX_DVR_HDD_NEUTRINO_X_LAUNCH.ELF -j2
          test -s build-hdd-diag/PSX_DVR_HDD_NEUTRINO_X_LAUNCH.ELF
          test -s hdd-diagnostics/neutrino-hdd-probe/DIAG_X.CNF
      - name: Check output is ELF32 little-endian MIPS, and exact dummy CNF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("PSX_DVR_HDD_NEUTRINO_V_PROBE.ELF","build-hdd-diag/PSX_DVR_HDD_NEUTRINO_V_LAUNCH.ELF","PSX_DVR_HDD_NEUTRINO_V2_UNPACKED.ELF","build-hdd-diag/PSX_DVR_HDD_NEUTRINO_V2_LAUNCH.ELF","PSX_DVR_HDD_NEUTRINO_W_ENTRY.ELF","build-hdd-diag/PSX_DVR_HDD_NEUTRINO_W_LAUNCH.ELF","PSX_DVR_HDD_NEUTRINO_X_LE.ELF","build-hdd-diag/PSX_DVR_HDD_NEUTRINO_X_LAUNCH.ELF"):
              b=Path(name).read_bytes()
              assert b[:6]==b"\x7fELF\x01\x01", name
              assert b[18:20]==b"\x08\x00", name
              print(name, len(b))
          cnf=Path("hdd-diagnostics/neutrino-hdd-probe/DIAG_V.CNF").read_bytes()
          assert cnf==(b"boot=PSX_DVR_HDD_NEUTRINO_V_PROBE.ELF\n"
                       b"arg=-bsd=dvr\n"
                       b"arg=-dvd=dvr_pfs0:/ISO/DIAG_V_NO_GAME.iso\n"
                       b"arg=-dev9=NICHDD\n")
          cnf2=Path("hdd-diagnostics/neutrino-hdd-probe/DIAG_V2.CNF").read_bytes()
          assert cnf2==(b"boot=PSX_DVR_HDD_NEUTRINO_V2_UNPACKED.ELF\n"
                        b"arg=-bsd=dvr\n"
                        b"arg=-dvd=dvr_pfs0:/ISO/DIAG_V_NO_GAME.iso\n"
                        b"arg=-dev9=NICHDD\n")
          import struct
          e_packed=struct.unpack_from('<I',Path("PSX_DVR_HDD_NEUTRINO_V_PROBE.ELF").read_bytes(),24)[0]
          e_plain=struct.unpack_from('<I',Path("PSX_DVR_HDD_NEUTRINO_V2_UNPACKED.ELF").read_bytes(),24)[0]
          assert e_packed != e_plain, (hex(e_packed),hex(e_plain))
          print("Packed entry",hex(e_packed),"Unpacked entry",hex(e_plain))
          w=Path("hdd-diagnostics/neutrino-hdd-probe/DIAG_W.CNF").read_bytes()
          assert w==(b"boot=PSX_DVR_HDD_NEUTRINO_W_ENTRY.ELF\n"
                     b"arg=-bsd=dvr\n"
                     b"arg=-dvd=dvr_pfs0:/ISO/DIAG_V_NO_GAME.iso\n"
                     b"arg=-dev9=NICHDD\n")
          print("W entry",hex(struct.unpack_from('<I',Path("PSX_DVR_HDD_NEUTRINO_W_ENTRY.ELF").read_bytes(),24)[0]))
          x=Path("hdd-diagnostics/neutrino-hdd-probe/DIAG_X.CNF").read_bytes()
          assert x==(b"boot=PSX_DVR_HDD_NEUTRINO_X_LE.ELF\n"
                     b"arg=-bsd=dvr\n"
                     b"arg=-dvd=dvr_pfs0:/ISO/DIAG_V_NO_GAME.iso\n"
                     b"arg=-dev9=NICHDD\n")
          print("X LE entry",hex(struct.unpack_from('<I',Path("PSX_DVR_HDD_NEUTRINO_X_LE.ELF").read_bytes(),24)[0]))
          PY
      - name: Upload V safe Neutrino HDD probe package
        uses: actions/upload-artifact@v4
        with:
          name: PSX-DVR-HDD-NEUTRINO-V-SAFE-PROBE
          path: |
            PSX_DVR_HDD_NEUTRINO_V_PROBE.ELF
            build-hdd-diag/PSX_DVR_HDD_NEUTRINO_V_LAUNCH.ELF
            hdd-diagnostics/neutrino-hdd-probe/DIAG_V.CNF
            hdd-diagnostics/neutrino-hdd-probe/README_PL.md
          if-no-files-found: error

      - name: Upload V2 uncompressed Neutrino HDD probe package
        uses: actions/upload-artifact@v4
        with:
          name: PSX-DVR-HDD-NEUTRINO-V2-UNPACKED-SAFE-PROBE
          path: |
            PSX_DVR_HDD_NEUTRINO_V2_UNPACKED.ELF
            build-hdd-diag/PSX_DVR_HDD_NEUTRINO_V2_LAUNCH.ELF
            hdd-diagnostics/neutrino-hdd-probe/DIAG_V2.CNF
            hdd-diagnostics/neutrino-hdd-probe/README_PL.md
          if-no-files-found: error

      - name: Upload Neutrino W first-entry screen with kernel delay
        uses: actions/upload-artifact@v4
        with:
          name: PSX-DVR-HDD-NEUTRINO-W-EARLY-ENTRY
          path: |
            PSX_DVR_HDD_NEUTRINO_W_ENTRY.ELF
            build-hdd-diag/PSX_DVR_HDD_NEUTRINO_W_LAUNCH.ELF
            hdd-diagnostics/neutrino-hdd-probe/DIAG_W.CNF
            hdd-diagnostics/neutrino-hdd-probe/README_PL.md
          if-no-files-found: error

      - name: Upload Neutrino X DVR load environment no-game probe
        uses: actions/upload-artifact@v4
        with:
          name: PSX-DVR-HDD-NEUTRINO-X-LE-SAFE-STOP
          path: |
            PSX_DVR_HDD_NEUTRINO_X_LE.ELF
            build-hdd-diag/PSX_DVR_HDD_NEUTRINO_X_LAUNCH.ELF
            hdd-diagnostics/neutrino-hdd-probe/DIAG_X.CNF
            hdd-diagnostics/neutrino-hdd-probe/README_PL.md
          if-no-files-found: error
