name: Build isolated HDD cover network repair
on:
  push:
    branches: [fix/hdd-cover-network-integrity]
    paths:
      - 'hdd-netfix/**'
      - 'dvr-iso-manager/**'
      - '.github/workflows/build-hdd-netfix.yml'
  workflow_dispatch:
    inputs:
      rx_pio:
        description: 'Fallback only after the normal NETFIX result: disable SMAP RX DMA'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - uses: actions/checkout@v4
        with:
          path: manager
      - uses: actions/checkout@v4
        with:
          repository: ps2dev/ps2sdk
          ref: d41ea62946e53d9a0c8788bb9eb8c8faf488b559
          path: sdk-source
      - name: Install build utilities
        run: apk add --no-cache cmake build-base python3 bash git patch
      - name: Build patched SDK
        env:
          RX_PIO: ${{ inputs.rx_pio || false }}
        run: |
          cd manager
          sh hdd-netfix/build_sdk.sh ../sdk-source
          mkdir -p dist
          cp "$PS2SDK/HDD_NETFIX_BUILD.txt" dist/BUILD_INFO.txt
          git -C ../sdk-source diff > dist/SDK_CHANGES.patch
      - name: Run Manager host checks
        run: |
          cd manager
          sh hdd-netfix/check_host.sh
      - name: Build separate NETFIX Manager
        run: |
          cd manager
          cmake -S dvr-iso-manager -B build-netfix -DDESR_BUILD_HDD_NETFIX=ON
          cmake --build build-netfix --target DVR_ISO_MANAGER_HDD_TEST.ELF -j2
          test -s build-netfix/DVR_ISO_MANAGER_HDD_TEST.ELF
          cp build-netfix/DVR_ISO_MANAGER_HDD_TEST.ELF dist/DVR_ISO_MANAGER_HDD_NETFIX.ELF
          cp build-netfix/HDD_NETFIX.map dist/
          cp hdd-netfix/README_PL.md dist/
          cd dist
          sha256sum DVR_ISO_MANAGER_HDD_NETFIX.ELF > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PSX-DVR-HDD-NETFIX-${{ inputs.rx_pio && 'PIO' || 'DMA' }}
          path: manager/dist/
          if-no-files-found: error
