name: Build PSX DVR ISO Manager 1.2 USB standalone-net RC TEST
on:
  push:
    branches: [test/v1.2-usb-https-covers, test/v1.2-usb-ui-en-rt-retry]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:673077792ed3824c9eba0854392b198d4c371f8bb689367aa0d05dfc5eccc598
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build and host test dependencies
        run: apk add --no-cache cmake make build-base git python3 curl ca-certificates libpng-dev zlib-dev
      - name: Verify published USB 1.0 assets and the public R4 CA bundle
        run: |
          set -eu
          mkdir -p prerequisites
          release=https://github.com/adamix95-lab/PSX_DVR_ISO_MANAGER/releases/download/1.0
          curl -fsSL --retry 3 "$release/PSX-DVR-ISO-Manager-v1.0.0-USB-COMPLETE.zip" \
            -o prerequisites/usb10.zip
          curl -fsSL --retry 3 "$release/PSX-DVR-ART-Server-v0.8.exe" \
            -o prerequisites/PSX-DVR-ART-Server-v0.8.exe
          curl -fsSL --retry 3 https://curl.se/ca/cacert-2026-11-05.pem -o prerequisites/N4E.CA
          curl -fsSL --retry 3 https://www.mozilla.org/media/MPL/2.0/index.815ca599c9df.txt \
            -o prerequisites/MPL-2.0.txt
          sha256sum -c <<'EOF'
          d3e2b08cdb22d33da9247e21bf0402e280b085693ccc9a623d29e34018f841c6  prerequisites/usb10.zip
          aabe7bcce7f594ed15763e44093f87d3e84893d44ea110a527da455872cdd86a  prerequisites/PSX-DVR-ART-Server-v0.8.exe
          427c064216761a1e72a8b30f0d954d08cb6e4435a82091fb865afd20c8497285  prerequisites/N4E.CA
          fab3dd6bdab226f1c08630b1dd917e11fcb4ec5e1e020e2c16f83a0a13863e85  prerequisites/MPL-2.0.txt
          EOF
      - name: Preserve the stock SDK for the USB Manager
        run: |
          set -eu
          stock_sdk="$RUNNER_TEMP/stock-ps2sdk"
          mkdir -p "$stock_sdk"
          cp -aL "$PS2SDK"/. "$stock_sdk"/
          test -f "$stock_sdk/ps2dev.cmake"
          test -x "$stock_sdk/bin/bin2c"
          test -f "$stock_sdk/ports/lib/libpng.a"
      - uses: actions/checkout@v4
        with:
          repository: ps2dev/ps2sdk
          ref: d41ea62946e53d9a0c8788bb9eb8c8faf488b559
          path: sdk-source
      - uses: actions/checkout@v4
        with:
          repository: wolfSSL/wolfssl
          ref: decea12e223869c8f8f3ab5a53dc90b69f436eb2
          path: wolfssl-n5a
      - uses: actions/checkout@v4
        with:
          repository: LoupVaillant/Monocypher
          ref: 907e90ddd4c78f02e0d49e90384e4197f7dcdf26
          path: monocypher-upstream
      - name: Host-test PNG normalizer and batch entropy format
        run: |
          set -eu
          manager=dvr-iso-manager
          cc -std=c11 -Wall -Wextra -Werror -I"$manager/include" \
            "$manager/src/net/probe_png.c" "$manager/src/net/n6_normalize_png.c" \
            "$manager/tests/net/test_n6_normalize_png.c" -lpng -lz -o /tmp/n6g-normalize
          /tmp/n6g-normalize
          work="$(mktemp -d)"
          trap 'rm -f "$work/N6G50.ENT" "$work/check"; rmdir "$work"' EXIT
          cc -std=c11 -Wall -Wextra -Werror -I"$manager/include" \
            "$manager/src/net/n6g_batch_entropy.c" \
            "$manager/tests/net/test_n6g_batch_entropy.c" -o "$work/check"
          python3 "$manager/tools/generate_n6g_batch_entropy.py" "$work/N6G50.ENT"
          "$work/check" "$work/N6G50.ENT"
      - name: Host-test CPU counter expansion and frozen input rejection
        run: |
          set -eu
          manager=dvr-iso-manager
          cc -std=c11 -O2 -Wall -Wextra -Werror -I"$manager/include" -Imonocypher-upstream/src \
            "$manager/src/net/n6g_cpu_entropy.c" "$manager/src/net/n6g_batch_entropy.c" \
            "$manager/tests/net/test_n6g_cpu_entropy.c" monocypher-upstream/src/monocypher.c \
            -o /tmp/n6g-cpu-entropy
          /tmp/n6g-cpu-entropy
      - name: Host-test the USB BATCH50 limit, resume and verified artwork writes
        run: |
          set -eu
          manager=dvr-iso-manager
          mock="$manager/tests/net/usb-art-mock"
          cc -std=c11 -Wall -Wextra -Werror -I"$manager/include" -I"$mock" \
            -DDESR_USB12_HTTPS=1 -DN6G_BATCH_50=1 -DN6D_READONLY=1 \
            "$manager/src/net/n6_usb_art.c" "$manager/src/iso_utils.c" \
            "$manager/src/cover_index.c" "$mock/test_batch_scan.c" -o /tmp/n6g-usb-scan
          /tmp/n6g-usb-scan
          cc -std=c11 -Wall -Wextra -Werror -I"$manager/include" -I"$mock" \
            -DDESR_USB12_HTTPS=1 -DN6G_BATCH_50=1 -DN6G_USB_SAFE=1 \
            "$manager/src/net/n6_usb_art.c" "$manager/src/net/probe_png.c" \
            "$manager/src/iso_utils.c" "$manager/src/cover_index.c" \
            "$mock/test_write.c" -o /tmp/n6g-usb-write
          /tmp/n6g-usb-write
      - name: Host-test HTTPS network config on USB, English UI, CA layout and Roughtime
        run: |
          set -eu
          cc -std=c11 -O2 -Wall -Wextra -Werror -Idvr-iso-manager/include \
            dvr-iso-manager/src/net/usb12_progress_ui.c \
            dvr-iso-manager/tests/net/test_usb12_progress_ui.c \
            -o /tmp/usb12-progress-ui
          /tmp/usb12-progress-ui
          cc -std=c11 -O2 -Wall -Wextra -Werror -Idvr-iso-manager/include -Imonocypher-upstream/src \
            dvr-iso-manager/src/net/n6g_roughtime_retry.c \
            dvr-iso-manager/tests/net/test_n6g_roughtime_retry.c \
            monocypher-upstream/src/monocypher.c -o /tmp/usb12-roughtime-retry
          /tmp/usb12-roughtime-retry
          python3 - <<'PY'
          from pathlib import Path
          worker=Path('dvr-iso-manager/src/v12_n6f_https_usb_art_one.c').read_text()
          manager=Path('dvr-iso-manager/src/main.c').read_text()
          covers=Path('dvr-iso-manager/include/usb12_covers.h').read_text()
          cmake=Path('dvr-iso-manager/usb12_worker.cmake').read_text()
          packer=Path('dvr-iso-manager/tools/pack_usb12_tail.py').read_text()
          assert 'N6G_UI_SIMPLE=1' in cmake
          assert 'src/net/usb12_progress_ui.c' in cmake
          assert 'n6g_ui_processing(*attempted)' in worker
          assert 'n6g_ui_done(*attempted,USB12_UI_SKIPPED)' in worker
          assert 'n6g_ui_done(*attempted,USB12_UI_OK)' in worker
          assert 'n6g_ui_done(*attempted,USB12_UI_ERROR)' in worker
          assert 'n6g_ui_summary(targets,saved,unavailable,rc)' in worker
          assert 'n6g_roughtime_retry(entropy->nonce,retry_signed_probe,&signed_time)' in worker
          assert '#define DESR_USB12_CA_FILE DESR_APP_ROOT "N4E.CA"' in covers
          assert '#define DESR_USB12_NET_CNF DESR_APP_ROOT "V12_NET.CNF"' in covers
          assert 'fileXioOpen(DESR_USB12_NET_CNF,FIO_O_RDONLY,0)' in worker
          assert 'if(rc==0)rc=read_cfg(&cfg);' in worker
          assert 'usb_ready=(rc==0);' in worker
          assert 'if(rc==0)rc=load_usb_modules();' not in worker.split('int main(int argc, char **argv) {',1)[-1].split('int main(void)',1)[0]
          assert '#ifndef DESR_USB12_HTTPS\n#define PART "hdd0:PP.DVRISO12"' in worker
          assert 'fileXioOpen(DESR_USB12_CA_FILE,FIO_O_RDONLY,0)' in worker
          assert 'Do not silently fall back to an outdated CA at the USB root.' in worker
          assert 'DESR_USB12_MANAGER_ELF, DESR_USB12_CA_FILE' in manager
          assert '#define scr_printf(...) ((void)0)' in worker
          assert '#define scr_clear() ((void)0)' in worker
          assert 'DOWNLOAD COMPLETE' in worker
          assert 'DOWNLOADING MISSING COVERS' in worker
          assert 'scr_printf("DOWNLOADED: %ld/%d' in manager
          assert 'scr_printf("SKIPPED: %d' in manager
          assert 'const unsigned dismiss = PAD_CROSS | PAD_CIRCLE' in manager
          assert 'if (pressed & ~held) break;' in manager
          assert 'BOOT_LOG("Resetting IOP' in manager
          assert 'usb12_quiet_return' in manager
          assert 'scr_printf("PLEASE WAIT...' in manager
          assert 'LoadELFFromFile(DESR_USB12_MANAGER_ELF,6,args)' in worker
          assert 'loader_rc=LoadELFFromFile(DESR_USB12_MANAGER_ELF,6,args);' in worker
          assert 'LoadELFFromFile(DESR_USB12_MANAGER_ELF,6,args));' not in worker
          # Muted screen calls must never contain an action in their arguments.
          assert 'n6g_ui_summary(targets,saved,unavailable,rc)' in worker

          assert 'pack-ui' in packer
          assert 'R1_WORKER_SHA' in packer
          print('PASS UI: counters, zero observer screen I/O, X/O, R4 preservation')
          PY
      - name: Rebuild pinned NETFIX PS2SDK for the HTTPS worker
        run: sh hdd-netfix/build_sdk.sh sdk-source
      - name: Build wolfSSL with the same options and diagnostics as BATCH50 R3
        run: |
          set -eu
          for patch in n5d_instrument_wolfssl n5e_instrument_senddata n5f_instrument_handshake n5g_instrument_tls13; do
            python3 "dvr-iso-manager/tools/$patch.py" wolfssl-n5a
          done
          export CFLAGS='-DWC_RNG_SEED_CB=1 -DHAVE_SNI=1 -DWOLFSSL_GETRANDOM -DNO_WRITEV -DXINET_PTON\(...\)=0 -DFP_MAX_BITS=8192'
          cmake -S wolfssl-n5a -B build-wolfssl-n5a \
            -DWOLFSSL_SP_MATH_ALL=no -DWOLFSSL_FAST_MATH=yes -DWOLFSSL_ASM=no \
            -DCMAKE_TOOLCHAIN_FILE="$PS2DEV/share/ps2dev.cmake" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/n5a-wolfssl" \
            -DCMAKE_PREFIX_PATH="$PS2SDK/ports" \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DWOLFSSL_CRYPT_TESTS=OFF -DWOLFSSL_EXAMPLES=OFF \
            -DWOLFSSL_CURL=ON -DWARNING_C_FLAGS=-w
          cmake --build build-wolfssl-n5a -j2
          cmake --install build-wolfssl-n5a
          options=n5a-wolfssl/include/wolfssl/options.h
          grep -q '^#define USE_FAST_MATH' "$options"
          grep -q '^#define TFM_NO_ASM' "$options"
          grep -q '^#define TFM_TIMING_RESISTANT' "$options"
          if grep -q '^#define WOLFSSL_SP_MATH_ALL' "$options"; then exit 1; fi
      - name: Host-test TLS arena callbacks
        run: |
          set -eu
          cc -std=c11 -Wall -Wextra -Werror -Idvr-iso-manager/include \
            -isystem n5a-wolfssl/include dvr-iso-manager/src/net/n6g_tls_arena.c \
            dvr-iso-manager/src/net/v12_n4a_entropy.c \
            dvr-iso-manager/tests/net/test_n6g_tls_arena.c -o /tmp/n6g-arena-test
          /tmp/n6g-arena-test
      - name: Build N6G FAT driver with exclusive file creation
        run: sh dvr-iso-manager/tools/build_n6g_fat.sh sdk-source "$GITHUB_WORKSPACE/n6g-bdmfs_fatfs.irx"
      - name: Cross-build NEW minimal-UI HTTPS worker with pinned NETFIX
        run: |
          set -eu
          export V12_N4B_WOLFSSL_DIR="$GITHUB_WORKSPACE/n5a-wolfssl"
          export V12_MONOCYPHER_SRC="$GITHUB_WORKSPACE/monocypher-upstream"
          export V12_N6G_FAT_IRX="$GITHUB_WORKSPACE/n6g-bdmfs_fatfs.irx"
          cmake -S dvr-iso-manager -B build-worker -DDESR_BUILD_USB12_WORKER=ON \
            -DDESR_USB12_EMBEDDED_WORKER=ON -DDESR_USB12_USE_CPU_ENTROPY=ON \
            -DDESR_USB12_SIMPLE_UI=ON
          cmake --build build-worker -j2 --target COVER_HTTPS_V12.ELF
          strings build-worker/COVER_HTTPS_V12.ELF > /tmp/worker-strings
          grep -Fx 'mass0:/DESR_DVR/DVR_ISO_MANAGER_V12_CPU.ELF' /tmp/worker-strings
          grep -Fx 'mass0:/DESR_DVR/N4E.CA' /tmp/worker-strings
          grep -Fx 'mass0:/DESR_DVR/V12_NET.CNF' /tmp/worker-strings
          if grep -Fx 'pfs1:/V12_NET.CNF' /tmp/worker-strings; then exit 1; fi
          if grep -Fx 'hdd0:PP.DVRISO12' /tmp/worker-strings; then exit 1; fi
          if grep -Fx 'mass0:/N4E.CA' /tmp/worker-strings; then exit 1; fi
          grep -F 'mass0:/DESR_DVR/ART' /tmp/worker-strings
          grep -Fx 'DOWNLOADING MISSING COVERS' /tmp/worker-strings
          grep -Fx 'PLEASE WAIT...' /tmp/worker-strings
          grep -Fx 'DOWNLOAD COMPLETE' /tmp/worker-strings
          grep -Fx 'SKIPPED' /tmp/worker-strings
          if grep -F 'N6G.CAFIRST' /tmp/worker-strings; then exit 1; fi
      - name: Strip and verify UI worker without substituting old R4
        run: |
          set -eu
          mips64r5900el-ps2-elf-strip --strip-debug \
            -o build-worker/usb12-payload.elf build-worker/COVER_HTTPS_V12.ELF
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          worker=Path('build-worker/usb12-payload.elf').read_bytes()
          assert worker[:4] == b'\x7fELF' and 200000 < len(worker) < 10000000
          assert hashlib.sha256(worker).hexdigest() != '23654c1755c1b79c3d30af32580f823ba451992dc3fcd654ce7bcfc234d7b489'
          for m in (b'DOWNLOADING MISSING COVERS',
                    b'PLEASE WAIT...',b'DOWNLOAD COMPLETE',
                    b'SKIPPED',b'DOWNLOADED: %d/%d'):
              assert m in worker,m
          print('NEW UI worker',len(worker),'SHA256',hashlib.sha256(worker).hexdigest())
          PY
      - name: Build thin Manager and embed exactly the NEW UI worker
        run: |
          set -eu
          export DESR_USB12_ELF_LOADER2_HEADER_DIR="$GITHUB_WORKSPACE/sdk-source/ee/elf-loader2/src/include"
          export DESR_USB12_ELF_LOADER2_LIBRARY="$PS2SDK/ee/lib/libelf-loader2.a"
          export DESR_USB12_PAYLOAD="$GITHUB_WORKSPACE/build-worker/usb12-payload.elf"
          export PS2SDK="$RUNNER_TEMP/stock-ps2sdk"
          cmake -S dvr-iso-manager -B build-manager -DDESR_BUILD_USB12_ONE_ELF=ON \
            -DDESR_USB12_USE_CPU_ENTROPY=ON -DDESR_USB12_USE_TAIL_PAYLOAD=ON \
            -DDESR_USB12_SIMPLE_UI=ON
          cmake --build build-manager -j2 --target DVR_ISO_MANAGER_V12_CPU.ELF
          manager=build-manager/DVR_ISO_MANAGER_V12_CPU.ELF
          mips64r5900el-ps2-elf-strip --strip-debug "$manager"
          python3 dvr-iso-manager/tools/pack_usb12_tail.py pack-ui "$manager" "$DESR_USB12_PAYLOAD"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          manager=Path('build-manager/DVR_ISO_MANAGER_V12_CPU.ELF').read_bytes()
          worker=Path('build-worker/usb12-payload.elf').read_bytes()
          footer=struct.pack('<8sII',b'N6GCPUR3',len(worker),len(worker)^0xffffffff)
          assert manager[-len(footer):] == footer
          assert manager[-len(footer)-len(worker):-len(footer)] == worker
          assert hashlib.sha256(manager).hexdigest() != '81a0f045e2597719d58d798499378afcdce7466a6c7ca967546c1499e2355741'
          print('UI Manager SHA256',hashlib.sha256(manager).hexdigest())
          print('Embedded worker SHA256',hashlib.sha256(worker).hexdigest())
          PY
          strings "$manager" > /tmp/usb12-strings
          grep -Fx '1.2 USB UI TEST' /tmp/usb12-strings
          grep -Fx 'X: PC APP (LAN HTTP)' /tmp/usb12-strings
          grep -Fx 'TRIANGLE: SERVER (HTTPS, UP TO 50)' /tmp/usb12-strings
          grep -Fx 'PSX DVR ISO MANAGER 1.2 USB' /tmp/usb12-strings
          grep -Fx 'mass0:/DESR_DVR/N4E.CA' /tmp/usb12-strings
          grep -Fx 'mass0:/DESR_DVR/V12_NET.CNF' /tmp/usb12-strings
          if grep -Fx 'pfs1:/V12_NET.CNF' /tmp/usb12-strings; then exit 1; fi
          if grep -Fx 'mass0:/N4E.CA' /tmp/usb12-strings; then exit 1; fi
          grep -Fx 'DOWNLOAD COMPLETE' /tmp/usb12-strings
          grep -Fx 'X / O: RETURN TO GAME LIST' /tmp/usb12-strings
          if grep -Fx 'Reading HTTPS worker from Manager ELF...' /tmp/usb12-strings; then exit 1; fi
          grep -Fx 'GET MANAGER FILE SIZE' /tmp/usb12-strings
          grep -Fx 'HTTPS PAYLOAD FOOTER' /tmp/usb12-strings
          if grep -F 'mass0:/DESR_DVR/COVER_HTTPS_V12.ELF' /tmp/usb12-strings; then exit 1; fi
          if grep -F 'mass0:/N6G50.ENT' /tmp/usb12-strings; then exit 1; fi
      - name: Package CA and network template in DESR_DVR, preserve USB 1.0 files
        run: |
          set -eu
          mkdir -p package/licenses package/tools
          python3 -m zipfile -e prerequisites/usb10.zip prerequisites/usb10
          cp -a prerequisites/usb10/PSX-DVR-ISO-Manager-v1.0-USB-COMPLETE/DESR_DVR package/
          cp build-manager/DVR_ISO_MANAGER_V12_CPU.ELF package/DESR_DVR/
          cp docs/usb12-ui-en-retry-test.md package/README.md
          cp release-tools/v1_2/V12_NET.CNF.example package/DESR_DVR/V12_NET.CNF.example
          cp prerequisites/N4E.CA package/DESR_DVR/N4E.CA
          cp prerequisites/PSX-DVR-ART-Server-v0.8.exe package/tools/
          cp prerequisites/MPL-2.0.txt package/licenses/
          cp wolfssl-n5a/LICENSING package/licenses/WOLFSSL-LICENSING
          cp wolfssl-n5a/COPYING package/licenses/WOLFSSL-COPYING
          cp sdk-source/LICENSE package/licenses/PS2SDK-AFL-2.0
          cp monocypher-upstream/LICENCE.md package/licenses/MONOCYPHER-LICENCE.md
          printf '%s\n' "$GITHUB_SHA" > package/SOURCE_COMMIT
          cd package
          find . -type f ! -name SHA256SUMS | LC_ALL=C sort | while IFS= read -r path; do
            sha256sum "${path#./}"
          done > SHA256SUMS
          sha256sum -c SHA256SUMS
          python3 -m zipfile -c ../PSX-DVR-ISO-Manager-1.2-USB-STANDALONE-NET-RC-TEST.zip \
            DESR_DVR README.md tools licenses SOURCE_COMMIT SHA256SUMS
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          expected = Path('prerequisites/N4E.CA').read_bytes()
          with ZipFile('PSX-DVR-ISO-Manager-1.2-USB-STANDALONE-NET-RC-TEST.zip') as z:
              paths = set(z.namelist())
              assert 'DESR_DVR/N4E.CA' in paths
              assert 'N4E.CA' not in paths
              assert 'DESR_DVR/V12_NET.CNF.example' in paths
              assert 'V12_NET.CNF.example' not in paths
              assert 'DESR_DVR/V12_NET.CNF' not in paths
              # User-specific network parameters MUST NOT be inferred or shipped.
              assert z.read('DESR_DVR/N4E.CA') == expected
              assert 'DESR_DVR/DVR_ISO_MANAGER_V12_CPU.ELF' in paths
              assert b'DESR_DVR/N4E.CA' in z.read('README.md')
          print('PASS: ZIP contains DESR_DVR CA + network template and does not include unconfigured V12_NET.CNF')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSX-DVR-ISO-Manager-1.2-USB-STANDALONE-NET-RC-TEST
          path: PSX-DVR-ISO-Manager-1.2-USB-STANDALONE-NET-RC-TEST.zip
          if-no-files-found: error
          retention-days: 30
