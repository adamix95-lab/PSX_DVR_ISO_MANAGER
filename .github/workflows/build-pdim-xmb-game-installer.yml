name: PDIM Standalone XMB Game Installer (development)
on:
  workflow_dispatch:
  push:
    branches: [fix/xmb-v03-execute-integrity]
    paths:
      - 'pdim-xmb-game-installer/**'
      - '.github/workflows/build-pdim-xmb-game-installer.yml'
jobs:
  build:
    name: Cross-compile standalone Sony PSX installer ELF
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew@sha256:673077792ed3824c9eba0854392b198d4c371f8bb689367aa0d05dfc5eccc598
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache make build-base python3 curl unzip file coreutils
      - uses: actions/checkout@v4
        with:
          repository: DanielFergisz/RepairBox-PSX-XMB-Apps-Installer
          ref: df426622e29ed14445e5732ba0ef137c4f2c38ba
          path: repairbox
      - name: Pin known functioning DESR IOP/driver assets and original XMB KELF
        shell: sh
        run: |
          set -eu
          mkdir -p pdim-xmb-game-installer/assets
          echo '5cdd4539464a2fe92d95d93692239c2bc80b9a99f0d7644d18ae66b756c68201  dvr-iso-manager/modules/dev9_ns.irx' | sha256sum -c -
          curl -fL --retry 3 "https://github.com/adamix95-lab/PSX_DVR_ISO_MANAGER/releases/download/1.2/PSX-DVR-ISO-Manager-v1.2.0-HDD-AUTO-OFFICIAL.zip" -o /tmp/pdim-v12-hdd-official.zip
          unzip -p /tmp/pdim-v12-hdd-official.zip PDIM_HDD_V12_INSTALLER/FILES/BOOT.ELF > pdim-xmb-game-installer/assets/BOOT.ELF
          unzip -p /tmp/pdim-v12-hdd-official.zip PDIM_HDD_V12_INSTALLER/FILES/EXECUTE.ELF > pdim-xmb-game-installer/assets/EXECUTE.ELF
          echo '64e45abcd92b1096dc490d38fc0a20ac9959004a4286c4cb661f00019423b3ae  pdim-xmb-game-installer/assets/BOOT.ELF' | sha256sum -c -
          echo 'b335a5010adc94635caf735b33229ce377f146f9c256974cc7fd2ebf38684b49  pdim-xmb-game-installer/assets/EXECUTE.ELF' | sha256sum -c -
      - name: Run host PPAA policy regression suite before cross-build
        shell: sh
        run: |
          set -eu
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ipdim-hdd-v1.2-installer/include \
            pdim-hdd-v1.2-installer/src/ppaa_plan.c \
            pdim-hdd-v1.2-installer/tests/test_ppaa_plan.c \
            -o /tmp/xmb-ppaa-host-test
          /tmp/xmb-ppaa-host-test
          python3 - <<'PY'
          from pathlib import Path
          s=Path("pdim-xmb-game-installer/src/engine.c").read_text()
          x=Path("pdim-xmb-game-installer/src/xmb.c").read_text()
          m=Path("pdim-xmb-game-installer/src/main.c").read_text()
          p=Path("pdim-xmb-game-installer/src/art_png.c").read_text()
          assert 'SG_SOURCE_PART "hdd0:PP.DVRISO"' in Path("pdim-xmb-game-installer/include/sg_installer.h").read_text()
          assert 'sg_probe(g,NULL,NULL)!=0' in s
          assert 'fileXioFormat("pfs:",dev,' in s
          assert 'FIO_MT_RDONLY' in s
          assert 'PDIMXMB1' in s
          assert 'path=hdd0:PP.DVRISO:pfs:/%s' in s
          assert 'sg_validate_payload(g,lang,' in x
          assert 'write_sector(sector+i,after[i])' in x
          assert 'write_sector(sector,after[0])' in x
          assert 'pdim12_ppaa_plan' in x
          assert 'PAD_L1|PAD_R1' in m
          assert 'PNG_COLOR_TYPE_PALETTE' in p
          print("PASS: standalone installer isolates PP.DVRISO (RO), validates per-game marker, PPAA last")
          PY
      - name: Host-test game shortcut names, FIX95 limits, and live ISO guard
        shell: sh
        run: |
          set -eu
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ipdim-xmb-game-installer/include -Idvr-iso-manager/include \
            pdim-xmb-game-installer/src/sg_policy.c \
            dvr-iso-manager/src/cover_index.c dvr-iso-manager/src/iso_utils.c \
            pdim-xmb-game-installer/tests/test_sg_policy.c \
            -o /tmp/sg-policy-test
          /tmp/sg-policy-test
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ipdim-xmb-game-installer/include -Idvr-iso-manager/include \
            -Idvr-iso-manager/tests/net/usb-art-mock \
            pdim-xmb-game-installer/src/sg_policy.c \
            pdim-xmb-game-installer/src/iso_id.c \
            dvr-iso-manager/src/cover_index.c dvr-iso-manager/src/iso_utils.c \
            pdim-xmb-game-installer/tests/test_iso_id.c \
            -o /tmp/sg-iso-id-fallback-test
          /tmp/sg-iso-id-fallback-test
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -Ipdim-xmb-game-installer/include \
            -Idvr-iso-manager/tests/net/usb-art-mock \
            pdim-xmb-game-installer/src/sg_exec_probe.c \
            pdim-xmb-game-installer/tests/test_sg_exec_probe.c \
            -o /tmp/sg-execute-probe-test
          /tmp/sg-execute-probe-test
          python3 - <<'PY'
          from pathlib import Path
          src = Path('pdim-xmb-game-installer/src/engine.c').read_text()
          xmb = Path('pdim-xmb-game-installer/src/xmb.c').read_text()
          iso = Path('pdim-xmb-game-installer/src/iso_id.c').read_text()
          assert 'sg_check_iso_id(g)' in src
          assert 'sg_check_iso_id(g)' in xmb
          assert 'sg_probe_iso_id' in iso and 'ISO_STREAM_LIMIT' in iso
          assert '2352u,16u' in iso and '2352u,24u' in iso
          assert 'sequential_read_at' in iso
          assert 'COVERS.BAK' in src and 'COVER_SCAN.LOG' in src
          assert 'sg_resolve_selected' in src
          m=Path('pdim-xmb-game-installer/src/main.c').read_text()
          assert 'sg_diagnose_shortcut(g,lang_en)' in m
          assert 'if(rc==6)' in m and 'if(rc==7)' in m
          assert 'sg_validate_payload(g,1-lang' in src
          assert 'void sg_diagnose_shortcut(const sg_game *g,int lang)' in src
          detail=src.split('void sg_diagnose_shortcut(const sg_game *g,int lang)',1)[1]
          assert 'mount_target(g->partition,0)' in detail
          assert 'fileXioWrite(' not in detail and 'fileXioFormat(' not in detail
          assert 'DIAG: SHORTCUT.ID' in detail and 'DIAG: BOOT.CNF' in detail
          diag=Path('pdim-xmb-game-installer/src/sg_exec_probe.c').read_text()
          assert 'sg_probe_execute(' in detail
          assert 'SG_EXEC_CRC_DIFF' in detail and 'SG_EXEC_SIZE_DIFF' in detail
          assert 'SG_EXEC_MISSING' in detail and 'SG_EXEC_READ_ERROR' in detail
          assert 'SG_EXEC_DIR_ERROR' in diag and 'SG_EXEC_OPEN_ERROR' in diag
          assert 'FIO_O_RDONLY' in diag
          assert 'fileXioWrite(' not in diag and 'fileXioFormat(' not in diag
          # Strict payload verification used before raw APA headers remains unchanged.
          strict=src.split('int sg_verify_mounted(',1)[1].split('int sg_validate_payload(',1)[0]
          assert 'match_embedded("EXECUTE.ELF",execute_kelf,size_execute_kelf)' in strict
          xmb=Path('pdim-xmb-game-installer/src/xmb.c').read_text()
          assert 'sg_validate_payload(g,lang' in xmb
          print('PASS: detailed read-only KELF probe; strict XMB APA gate unchanged')
          print('PASS: SQUARE read-only shortcut diagnostics; selected language never modified')
          assert 'desr_iso_root(' in iso and 'desr_cnf_game_id(' in iso
          assert 'conflict[i]=conflict[j]=1' in src
          assert 'sg_iso_filename_allowed(g->filename)' in src
          print('PASS: live ISO Game ID recheck before APA writes, duplicate-name protection')
          PY
      - name: Compile PS2 EE/IOP static installer
        shell: sh
        run: |
          set -eu
          make -C pdim-xmb-game-installer VENDOR_IRX="$GITHUB_WORKSPACE/repairbox/irx" -j2 all
          mkdir -p out
          cp pdim-xmb-game-installer/build/PDIM_XMB_GAME_INSTALLER.ELF out/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("out/PDIM_XMB_GAME_INSTALLER.ELF")
          b=p.read_bytes()
          assert b[:4]==b'\x7fELF'
          assert int.from_bytes(b[18:20],'little')==8
          assert b'PDIM XMB GAME INSTALLER' in b
          assert b'PP.DVRISO12' not in b
          assert len(b)>1000000
          print("PASS: MIPS ELF / standalone XMB Game Installer /",len(b),"bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PDIM-XMB-GAME-INSTALLER-v0.3.2-EXECUTE-CRC-DIAG
          path: out/PDIM_XMB_GAME_INSTALLER.ELF
          if-no-files-found: error
          retention-days: 21
