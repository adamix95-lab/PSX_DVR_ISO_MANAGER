name: Build clean user-approved PSX DVR ISO Manager v0.8 USB ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'release-tools/**'
      - '.github/workflows/build-usb-package-v0.8.yml'
permissions:
  contents: read
jobs:
  build-complete-usb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the USB bundle assembly and safety checks
        run: python3 -m unittest discover -s release-tools -p 'test_*.py' -v
      - name: Download the repository's exact published v0.3 and v0.8 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/usb-build/v03 /tmp/usb-build/v08
          gh release download v0.3.0 --repo "$GITHUB_REPOSITORY" \
            --pattern 'PSX.DVR.ISO.MANAGER.03.zip' --dir /tmp/usb-build/v03
          gh release download v0.8 --repo "$GITHUB_REPOSITORY" \
            --pattern 'DVR_ISO_MANAGER.ELF' --dir /tmp/usb-build/v08
          test -s /tmp/usb-build/v03/PSX.DVR.ISO.MANAGER.03.zip
          test -s /tmp/usb-build/v08/DVR_ISO_MANAGER.ELF
      - name: Assemble checked single-folder USB ZIP
        run: |
          python3 release-tools/build_usb_bundle_v08.py \
            --legacy /tmp/usb-build/v03/PSX.DVR.ISO.MANAGER.03.zip \
            --manager /tmp/usb-build/v08/DVR_ISO_MANAGER.ELF \
            --output dist/PSX-DVR-ISO-Manager-v0.8-USB-COMPLETE.zip
          test -s dist/PSX-DVR-ISO-Manager-v0.8-USB-COMPLETE.zip
      - name: Verify user-uploaded clean USB file set and unchanged v0.8 Manager
        run: |
          python3 - <<'PY'
          import hashlib
          import sys
          import zipfile
          sys.path.insert(0, 'release-tools')
          from build_usb_bundle_v08 import (
              ZIP_ROOT, FOLDER, LEGACY_FOLDER, OLD_MANAGER, NEW_MANAGER,
              EXCLUDED_V03_FILES, USER_UPLOADED_FILES,
              USER_UPLOADED_CONTENT_FINGERPRINT, content_fingerprint,
          )
          old='/tmp/usb-build/v03/PSX.DVR.ISO.MANAGER.03.zip'
          new='dist/PSX-DVR-ISO-Manager-v0.8-USB-COMPLETE.zip'
          elf='/tmp/usb-build/v08/DVR_ISO_MANAGER.ELF'
          with zipfile.ZipFile(old) as legacy, zipfile.ZipFile(new) as packed:
              old_files=[
                  n for n in legacy.namelist()
                  if n.startswith(LEGACY_FOLDER) and not n.endswith('/')
                  and n[len(LEGACY_FOLDER):] not in EXCLUDED_V03_FILES
              ]
              for src in old_files:
                  relative=src[len(LEGACY_FOLDER):]
                  if relative=='BOOT.elf':
                      relative='BOOT.ELF'
                  dst=FOLDER+relative
                  assert packed.read(dst)==legacy.read(src), f'Changed v0.3 file: {src}'
              assert packed.read(NEW_MANAGER)==open(elf,'rb').read()
              dirs={ZIP_ROOT,FOLDER,FOLDER+'ART/',FOLDER+'config/',FOLDER+'modules/'}
              assert set(n for n in packed.namelist() if n.endswith('/'))==dirs
              assert not any(n in packed.namelist() for n in (
                  OLD_MANAGER, FOLDER+'BOOT_RECOVERY.CNF', FOLDER+'DVR_TEST.CNF',
                  FOLDER+'info.sys', FOLDER+'jkt_001.png',
                  FOLDER+'jkt_002.png', FOLDER+'jkt_cp.png',
                  FOLDER+'SHA256SUMS.txt',
              ))
              assert packed.testzip() is None
              members={
                  n:packed.read(n) for n in packed.namelist() if not n.endswith('/')
              }
              assert len(members)==USER_UPLOADED_FILES
              assert len(packed.namelist())==86
              actual=content_fingerprint(members)
              assert actual==USER_UPLOADED_CONTENT_FINGERPRINT,actual
              print('PASS: 81 exact filenames and contents match the user ZIP')
              print('PASS: 5 original directories retained, no old tests')
              print('PASS: Official v0.8 ELF unchanged')
              print('ZIP SHA-256:', hashlib.sha256(open(new,'rb').read()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PSX-DVR-ISO-Manager-v0.8-USB-COMPLETE
          path: dist/PSX-DVR-ISO-Manager-v0.8-USB-COMPLETE.zip
          if-no-files-found: error

  publish-zip:
    if: github.ref == 'refs/heads/main'
    needs: build-complete-usb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PSX-DVR-ISO-Manager-v0.8-USB-COMPLETE
          path: dist
      - name: Add the full USB ZIP without modifying the original ELF or Windows EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(tr -d '\r\n' < VERSION)" = '0.8'
          test -s dist/PSX-DVR-ISO-Manager-v0.8-USB-COMPLETE.zip
          gh release view v0.8 --repo "$GITHUB_REPOSITORY"
          gh release upload v0.8 dist/PSX-DVR-ISO-Manager-v0.8-USB-COMPLETE.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v0.8 --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
          gh release view v0.8 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name'
