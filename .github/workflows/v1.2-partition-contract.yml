name: Validate experimental v1.2 HDD partition isolation

on:
  push:
    branches:
      - feature/v1.2-native-https
    paths:
      - 'dvr-iso-manager/include/runtime_storage.h'
      - 'dvr-iso-manager/src/main.c'
      - 'dvr-iso-manager/CMakeLists.txt'
      - 'dvr-iso-manager/tests/test_v12_partition_contract.py'
      - '.github/workflows/v1.2-partition-contract.yml'
      - 'dvr-iso-manager/include/v12_https_policy.h'
      - 'dvr-iso-manager/src/net/v12_https_policy.c'
      - 'dvr-iso-manager/tests/net/test_v12_https_policy.c'
      - 'dvr-iso-manager/include/v12_https_client.h'
      - 'dvr-iso-manager/src/net/v12_https_client.c'
      - 'dvr-iso-manager/tests/net/test_v12_https_client.c'
      - 'dvr-iso-manager/include/v12_net_config.h'
      - 'dvr-iso-manager/src/net/v12_net_config.c'
      - 'dvr-iso-manager/tests/net/test_v12_net_config.c'
      - 'dvr-iso-manager/include/v12_tls_clock.h'
      - 'dvr-iso-manager/src/net/v12_tls_clock.c'
      - 'dvr-iso-manager/tests/net/test_v12_tls_clock.c'
      - 'dvr-iso-manager/include/v12_ntp.h'
      - 'dvr-iso-manager/src/net/v12_ntp.c'
      - 'dvr-iso-manager/tests/net/test_v12_ntp.c'
      - 'dvr-iso-manager/include/v12_roughtime_wire.h'
      - 'dvr-iso-manager/src/net/v12_roughtime_wire.c'
      - 'dvr-iso-manager/tests/net/test_v12_roughtime_wire.c'
      - 'dvr-iso-manager/tests/net/v12_roughtime_reference_verify.py'
      - 'dvr-iso-manager/include/v12_roughtime_verify.h'
      - 'dvr-iso-manager/src/net/v12_roughtime_verify.c'
      - 'dvr-iso-manager/tests/net/generate_v12_rt_test_header.py'
      - 'dvr-iso-manager/tests/net/test_v12_roughtime_verify.c'
      - 'dvr-iso-manager/include/v12_roughtime_nonce.h'
      - 'dvr-iso-manager/src/net/v12_roughtime_nonce.c'
      - 'dvr-iso-manager/tests/net/test_v12_roughtime_nonce.c'
      - 'dvr-iso-manager/include/v12_rt_reservation.h'
      - 'dvr-iso-manager/src/net/v12_rt_reservation.c'
      - 'dvr-iso-manager/tests/net/test_v12_rt_reservation.c'
      - 'dvr-iso-manager/include/v12_rt_journal.h'
      - 'dvr-iso-manager/src/net/v12_rt_journal.c'
      - 'dvr-iso-manager/tests/net/test_v12_rt_journal.c'
      - 'dvr-iso-manager/tests/fixtures/roughtime_ietf_draft08_001.json'
      - 'dvr-iso-manager/tests/fixtures/README.md'
      - 'dvr-iso-manager/src/lan_art_sync.c'
      - 'dvr-iso-manager/include/lan_art_sync.h'
      - 'neutrino-hdd-v1/patch_hdd_runtime_v12.py'
      - 'dvr-iso-manager/tests/test_v12_neutrino_partition.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-safety-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate v1.2 isolation and unchanged stable paths
        run: |
          python3 dvr-iso-manager/tests/test_v12_partition_contract.py
          python3 dvr-iso-manager/tests/test_v12_neutrino_partition.py
      - name: Host test native HTTPS allowlist and PNG response validation
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Idvr-iso-manager/include \
            dvr-iso-manager/src/net/probe_png.c \
            dvr-iso-manager/src/net/v12_https_policy.c \
            dvr-iso-manager/tests/net/test_v12_https_policy.c \
            -o /tmp/v12_https_policy_test
          /tmp/v12_https_policy_test
      - name: Host test isolated V12_NET.CNF parser
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Idvr-iso-manager/include \
            dvr-iso-manager/src/net/v12_net_config.c \
            dvr-iso-manager/tests/net/test_v12_net_config.c \
            -o /tmp/v12_net_config_test
          /tmp/v12_net_config_test
      - name: Host test PS2 RTC sanity gating (no TLS bypass)
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Idvr-iso-manager/include \
            dvr-iso-manager/src/net/v12_tls_clock.c \
            dvr-iso-manager/tests/net/test_v12_tls_clock.c \
            -o /tmp/v12_tls_clock_test
          /tmp/v12_tls_clock_test
      - name: Host test unauthenticated NTP decoding and strict packet validation
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Idvr-iso-manager/include \
            dvr-iso-manager/src/net/v12_ntp.c \
            dvr-iso-manager/tests/net/test_v12_ntp.c \
            -o /tmp/v12_ntp_test
          /tmp/v12_ntp_test
      - name: Host test untrusted Roughtime packet framing
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Idvr-iso-manager/include \
            dvr-iso-manager/src/net/v12_roughtime_wire.c \
            dvr-iso-manager/tests/net/test_v12_roughtime_wire.c \
            -o /tmp/v12_roughtime_wire_test
          /tmp/v12_roughtime_wire_test
      - name: Setup Python for N3B signature tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host-only Ed25519 verification dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Verify Roughtime Ed25519 delegation, signed response and Merkle proof
        run: python dvr-iso-manager/tests/net/v12_roughtime_reference_verify.py
      - name: Host-only HMAC-SHA256 secure-seed nonce construction test
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Idvr-iso-manager/include \
            dvr-iso-manager/src/net/v12_roughtime_nonce.c \
            dvr-iso-manager/tests/net/test_v12_roughtime_nonce.c \
            -lcrypto -o /tmp/v12_rt_nonce_test
          /tmp/v12_rt_nonce_test
      - name: Test N3C offline durable-counter reservation policy
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Idvr-iso-manager/include \
            dvr-iso-manager/src/net/v12_roughtime_nonce.c \
            dvr-iso-manager/src/net/v12_rt_reservation.c \
            dvr-iso-manager/tests/net/test_v12_rt_reservation.c \
            -lcrypto -o /tmp/v12_rt_reservation_test
          /tmp/v12_rt_reservation_test
      - name: Test N3C versioned two-slot metadata journal and accidental corruption
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Idvr-iso-manager/include \
            dvr-iso-manager/src/net/v12_rt_journal.c \
            dvr-iso-manager/tests/net/test_v12_rt_journal.c \
            -o /tmp/v12_rt_journal_test
          /tmp/v12_rt_journal_test
      - name: Host C Roughtime verifier with independent OpenSSL backend
        run: |
          python dvr-iso-manager/tests/net/generate_v12_rt_test_header.py /tmp/v12_rt_test_vector.h
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Idvr-iso-manager/include -I/tmp \
            dvr-iso-manager/src/net/v12_roughtime_verify.c \
            dvr-iso-manager/tests/net/test_v12_roughtime_verify.c \
            -lcrypto -o /tmp/v12_rt_c_test
          /tmp/v12_rt_c_test


      - name: Host test bounded HTTPS downloader with mock verified TLS
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -Idvr-iso-manager/include \
            dvr-iso-manager/src/net/probe_png.c \
            dvr-iso-manager/src/net/v12_https_policy.c \
            dvr-iso-manager/src/net/v12_https_client.c \
            dvr-iso-manager/tests/net/test_v12_https_client.c \
            -o /tmp/v12_https_client_test
          /tmp/v12_https_client_test
