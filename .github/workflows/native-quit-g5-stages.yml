name: Native QUIT G5 - on-screen DVR ISO stage diagnostic USB

on:
  workflow_dispatch:
  push:
    branches: [feature/native-quit-igr]
    paths:
      - 'native-quit-igr/g5/**'
      - 'native-quit-igr/g2/patch_usb_manager_folder.py'
      - '.github/workflows/native-quit-g5-stages.yml'

permissions:
  contents: read

jobs:
  manager:
    name: G5${{ matrix.variant }} isolated USB Manager
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    strategy:
      fail-fast: false
      matrix:
        variant: [G5A, G5B]
    steps:
      - uses: actions/checkout@v4
        with:
          path: manager
      - name: Build Manager with test-only USB folder
        shell: sh
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eu
          apk add --no-cache cmake build-base python3
          python3 manager/native-quit-igr/g2/patch_usb_manager_folder.py \
            manager/dvr-iso-manager/include/runtime_storage.h "DESR_$VARIANT"
          cmake -S manager/dvr-iso-manager -B build-manager
          cmake --build build-manager --target DVR_ISO_MANAGER.ELF -j2
          mkdir -p dist
          cp build-manager/DVR_ISO_MANAGER.ELF dist/DVR_ISO_MANAGER.ELF
          python3 - <<'PY'
          import os,struct
          from pathlib import Path
          b=Path("dist/DVR_ISO_MANAGER.ELF").read_bytes()
          label=os.environ["VARIANT"].encode()
          assert b[:6]==b'\x7fELF\x01\x01' and struct.unpack_from("<H",b,18)[0]==8
          assert b"mass0:/DESR_"+label+b"/" in b
          assert b"1.0 USB "+label in b
          assert b"mass0:/DESR_DVR/" not in b
          assert b"dvr_pfs0:/ISO/" in b
          assert b"PP.TESTDVR" not in b
          print("PASS:",label,"Manager",len(b))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G5-manager-${{ matrix.variant }}
          path: dist/DVR_ISO_MANAGER.ELF
          if-no-files-found: error

  neutrino:
    name: G5${{ matrix.variant }} Neutrino SYSTEM
    runs-on: ubuntu-latest
    container: ps2max/dev:v20260228
    strategy:
      fail-fast: false
      matrix:
        variant: [G5A, G5B]
    steps:
      - uses: actions/checkout@v4
        with:
          path: manager
      - uses: actions/checkout@v4
        with:
          repository: ps2max32/neutrino
          ref: aa8d80a1a0b5323cb407c814c0568c3489597c1c
          fetch-depth: 0
          path: neutrino
      - name: Build ISO/FHI stage-stop diagnostic, mode 0 vs mode 1
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD/neutrino"
          test "$(git -C neutrino rev-parse HEAD)" = aa8d80a1a0b5323cb407c814c0568c3489597c1c
          git -C neutrino diff --exit-code
          python3 manager/native-quit-igr/g5/patch_stage_probe.py \
            neutrino/ee/loader/src/main.c neutrino/ee/loader/Makefile "$VARIANT"
          git -C neutrino diff --check
          test "$(git -C neutrino diff --name-only)" = "$(printf 'ee/loader/Makefile\nee/loader/src/main.c')"
          python3 - <<'PY'
          from pathlib import Path
          import os
          src=Path("neutrino/ee/loader/src/main.c").read_text()
          v=os.environ["VARIANT"]
          mode="0" if v=="G5A" else "1"
          assert 'uint8_t in[4] = {'+mode+'};' in src
          assert src.count('g5_stop(199, "EE handoff reached; ISO/FHI PASS"')==1
          assert 'g5_scmd_status = out[0]' in src
          assert "sceCdApplySCmd(0x29, in, 1, out);" in src
          assert "sceCdApplySCmd(0x29, in, 4, out);" not in src
          assert 'g5_note(61, "ISO open() about to start"' in src
          assert 'g5_note(68, "Before FHI add_file_fd"' in src
          assert 'g5_note(90, "Before game SYSTEM.CNF read"' in src
          assert "desr_g4_change_system_ps2" not in src
          assert "PP.DVRISO" not in src
          mk=Path("neutrino/ee/loader/Makefile").read_text()
          assert "EE_LIBS = -lfileXio -lpatches -lcdvd -ldebug" in mk
          print("PASS G5: stage probes and deliberate no-game handoff")
          PY
          make -C neutrino/ee/loader all
          test -s neutrino/ee/loader/neutrino_unpacked.elf
          python3 - <<'PY'
          from pathlib import Path
          import os
          b=Path("neutrino/ee/loader/neutrino_unpacked.elf").read_bytes()
          v=os.environ["VARIANT"].encode()
          for marker in (
              b"PSX DESR NATIVE QUIT "+v+b" / USB ONLY",
              b"ISO LOAD DIAGNOSTIC - GAME WILL NOT START",
              b"Before ISO sector 16 PVD read",
              b"ISO setup and FHI attach PASS",
              b"EE handoff reached; ISO/FHI PASS",
              b"INTENTIONAL G5 STOP"):
              assert marker in b, marker
          print("PASS G5: debug text present in UNPACKED ELF")
          PY
          mkdir -p dist
          cp neutrino/ee/loader/neutrino.elf dist/neutrino.elf
          python3 - <<'PY'
          import struct,hashlib,os
          from pathlib import Path
          b=Path("dist/neutrino.elf").read_bytes()
          assert b[:6]==b'\x7fELF\x01\x01' and struct.unpack_from("<H",b,18)[0]==8
          print("PASS MIPS",os.environ["VARIANT"],len(b),hashlib.sha256(b).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: G5-neutrino-${{ matrix.variant }}
          path: dist/neutrino.elf
          if-no-files-found: error

  package:
    name: Verify official 1.0 payload and publish G5-only test ZIP
    needs: [manager, neutrino]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published official USB v1.0 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/release
          gh release download 1.0 --repo "$GITHUB_REPOSITORY" \
            --pattern "PSX-DVR-ISO-Manager-v1.0.0-USB-COMPLETE.zip" \
            --dir input/release
          test -s input/release/PSX-DVR-ISO-Manager-v1.0.0-USB-COMPLETE.zip
      - uses: actions/download-artifact@v4
        with:
          name: G5-manager-G5A
          path: input/manager-g5a
      - uses: actions/download-artifact@v4
        with:
          name: G5-manager-G5B
          path: input/manager-g5b
      - uses: actions/download-artifact@v4
        with:
          name: G5-neutrino-G5A
          path: input/neutrino-g5a
      - uses: actions/download-artifact@v4
        with:
          name: G5-neutrino-G5B
          path: input/neutrino-g5b
      - name: Package checked G5A and G5B roots — no HDD/XMB files
        run: |
          python3 native-quit-igr/g5/package_g5.py \
            --release input/release/PSX-DVR-ISO-Manager-v1.0.0-USB-COMPLETE.zip \
            --manager-g5a input/manager-g5a/DVR_ISO_MANAGER.ELF \
            --manager-g5b input/manager-g5b/DVR_ISO_MANAGER.ELF \
            --neutrino-g5a input/neutrino-g5a/neutrino.elf \
            --neutrino-g5b input/neutrino-g5b/neutrino.elf \
            --output dist/DESR_QUIT_G5_USB_STAGE_PROBES.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DESR-QUIT-G5-USB-STAGES-UNTESTED
          path: dist/DESR_QUIT_G5_USB_STAGE_PROBES.zip
          if-no-files-found: error
