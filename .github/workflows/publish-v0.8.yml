name: Publish PSX DVR ISO Manager v0.8
on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake
        run: apk add --no-cache cmake build-base
      - name: Host tests and PS2 build
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Idvr-iso-manager/include dvr-iso-manager/src/iso_utils.c dvr-iso-manager/tests/test_iso_utils.c -o /tmp/test_cnf
          /tmp/test_cnf
          cc -std=c99 -Wall -Wextra -Werror -Idvr-iso-manager/include dvr-iso-manager/src/iso_utils.c dvr-iso-manager/src/cover_index.c dvr-iso-manager/tests/test_cover_index.c -o /tmp/test_cover_index
          /tmp/test_cover_index
          cc -std=c99 -Wall -Wextra -Werror -Idvr-iso-manager/include dvr-iso-manager/src/cover_color.c dvr-iso-manager/tests/test_cover_color.c -o /tmp/test_cover_color
          /tmp/test_cover_color
          cc -std=c99 -Wall -Wextra -Werror -Idvr-iso-manager/include dvr-iso-manager/src/iso_utils.c dvr-iso-manager/src/cover_index.c dvr-iso-manager/src/cover_report.c dvr-iso-manager/tests/test_cover_report.c -o /tmp/test_cover_report
          /tmp/test_cover_report
          cc -std=c99 -Wall -Wextra -Werror -Idvr-iso-manager/include dvr-iso-manager/src/net/probe_config.c dvr-iso-manager/tests/net/test_probe_config.c -o /tmp/test_net_cfg
          /tmp/test_net_cfg
          cc -std=c99 -Wall -Wextra -Werror -Idvr-iso-manager/include dvr-iso-manager/src/net/probe_png.c dvr-iso-manager/tests/net/test_probe_png.c -o /tmp/test_http_png
          /tmp/test_http_png
          cc -std=c99 -Wall -Wextra -Werror -Idvr-iso-manager/include dvr-iso-manager/src/net/art_sync.c dvr-iso-manager/tests/net/test_art_sync.c -o /tmp/test_art_sync
          /tmp/test_art_sync
          cmake -S dvr-iso-manager -B build-dvr-manager
          cmake --build build-dvr-manager -j2
          test -s build-dvr-manager/DVR_ISO_MANAGER.ELF
      - uses: actions/upload-artifact@v4
        with:
          name: manager-elf-v0.8
          path: build-dvr-manager/DVR_ISO_MANAGER.ELF
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r pc-art-server/requirements.txt "pyinstaller>=6.12,<7"
      - name: Run server tests and build EXE
        run: |
          python -m unittest discover -s pc-art-server/tests -p "test_*.py" -v
          python -m PyInstaller --onefile --windowed --noconfirm --clean --name PSX-DVR-ART-Server-v0.8 pc-art-server/psx_dvr_art_server.py
        env:
          PYTHONPATH: pc-art-server
      - name: Confirm Windows EXE
        shell: pwsh
        run: |
          if (!(Test-Path dist/PSX-DVR-ART-Server-v0.8.exe)) { throw "EXE missing" }
          if ((Get-Item dist/PSX-DVR-ART-Server-v0.8.exe).Length -lt 100000) { throw "EXE too small" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe-v0.8
          path: dist/PSX-DVR-ART-Server-v0.8.exe
          if-no-files-found: error
  publish:
    runs-on: ubuntu-latest
    needs: [manager, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manager-elf-v0.8
          path: release-assets/manager
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe-v0.8
          path: release-assets/windows
      - name: Publish tagged release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          test "$VERSION_VALUE" = "0.8"
          if gh release view "v$VERSION_VALUE" >/dev/null 2>&1; then
            echo "Release v$VERSION_VALUE already exists; preserving it."
            exit 0
          fi
          test -s release-assets/manager/DVR_ISO_MANAGER.ELF
          test -s release-assets/windows/PSX-DVR-ART-Server-v0.8.exe
          gh release create "v$VERSION_VALUE" \
            --target "$GITHUB_SHA" \
            --title "PSX DVR ISO Manager v$VERSION_VALUE" \
            --notes-file RELEASE_NOTES.md \
            release-assets/manager/DVR_ISO_MANAGER.ELF \
            release-assets/windows/PSX-DVR-ART-Server-v0.8.exe
